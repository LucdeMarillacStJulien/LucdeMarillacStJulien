name: Generate contribution snake

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%23DB0A40&color_dots=%23e8ebf5,%239aa6cf,%234a5da8,%23121F45
            dist/snake-dark.svg?color_snake=%23DB0A40&color_dots=%23121F45,%232b3f7d,%235b6fb8,%23FFC906

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
