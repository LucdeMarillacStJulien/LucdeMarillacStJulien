<text x="25" y="124" class="l">Public repositories</text>
<text x="365" y="124" class="v" text-anchor="end">6</text>
<text x="25" y="150" class="l">Repositories contributed to</text>
<text x="365" y="150" class="v" text-anchor="end">6</text>
<text x="25" y="176" class="l">Stars earned</text>
<text x="365" y="176" class="v" text-anchor="end">0</text>
<text x="365" y="200" class="f" text-anchor="end">Updated 2026-09-18</text>
</svg>
