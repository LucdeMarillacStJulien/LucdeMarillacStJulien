<svg xmlns="http://www.w3.org/2000/svg" width="780" height="195" viewBox="0 0 780 195" role="img" aria-labelledby="title">
<title id="title">GitHub contribution streak</title>
<style>
.t { font: 600 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #70a5fd; }
.l { font: 400 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #a9b1d6; }
.v { font: 700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #38bdae; }
.big { font: 700 28px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #38bdae; }
.s { font: 400 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #a9b1d6; }
.f { font: 400 10px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #a9b1d6; opacity: .55; }
</style>
<rect width="780" height="195" rx="6" fill="#1a1b27"/>
<line x1="260" y1="30" x2="260" y2="170" stroke="#a9b1d6" stroke-opacity=".25"/>
<line x1="520" y1="30" x2="520" y2="170" stroke="#a9b1d6" stroke-opacity=".25"/>
<circle cx="390" cy="72" r="40" fill="none" stroke="#fe428e" stroke-width="5"/>
<text x="130" y="82" class="big" text-anchor="middle">696</text>
<text x="130" y="140" class="l" text-anchor="middle">Total Contributions</text>
<text x="130" y="163" class="s" text-anchor="middle">Jul 28, 2023 – Present</text>
<text x="390" y="82" class="big" text-anchor="middle">10</text>
<text x="390" y="140" class="l" text-anchor="middle">Current Streak</text>
<text x="390" y="163" class="s" text-anchor="middle">Sep 12 – Sep 21</text>
<text x="650" y="82" class="big" text-anchor="middle">10</text>
<text x="650" y="140" class="l" text-anchor="middle">Longest Streak</text>
<text x="650" y="163" class="s" text-anchor="middle">Sep 12 – Sep 21</text>
</svg>
